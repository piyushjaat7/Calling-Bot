[project]
name = "calling-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.140.5",
    "httpx>=0.28.1",
    "langchain>=1.3.2",
    "langgraph>=1.2.2",
    "loguru>=0.7.3",
    "ollama>=0.6.2",
    "openai>=2.48.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
